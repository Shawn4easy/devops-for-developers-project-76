---
# Переходники на секреты. Сами значения лежат в vault.yml этого же каталога,
# зашифрованном ansible-vault; в репозиторий он не попадает.
#
# Всё несекретное — в group_vars/all/main.yml.

redmine_db_password: "{{ vault_redmine_db_password }}"
redmine_secret_key_base: "{{ vault_redmine_secret_key_base }}"

datadog_api_key: "{{ vault_datadog_api_key }}"
