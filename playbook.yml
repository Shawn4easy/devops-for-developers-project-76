---
- name: Prepare application servers
  hosts: all
  become: true
  tags: setup

  pre_tasks:
    # На машинах нет маршрута IPv6. Если DNS отдаёт AAAA первыми, python-модули
    # Ansible падают с "Network is unreachable". Приоритет IPv4 убирает эту
    # зависимость от того, что вернул резолвер.
    - name: Prefer IPv4 over IPv6 in getaddrinfo
      ansible.builtin.lineinfile:
        path: /etc/gai.conf
        line: "precedence ::ffff:0:0/96  100"
        regexp: '^\s*precedence\s+::ffff:0:0/96'
        state: present
        create: true
        mode: "0644"

    # apt не смотрит в /etc/gai.conf и упорно ходит по IPv6, которого на машинах
    # нет: каждый репозиторий сначала отдаёт серию "Network is unreachable".
    - name: Force apt to use IPv4
      ansible.builtin.copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99-force-ipv4
        mode: "0644"

    # Образ приезжает с устаревшим индексом apt: он ссылается на версии пакетов,
    # которых на зеркале уже нет, и установка падает с 404.
    #
    # cache_valid_time здесь не ставим намеренно: в свежем контейнере индекс
    # бывает новым по времени, но неполным по содержимому, и тогда Ansible
    # пропустит обновление, а следующая задача не найдёт пакет.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Роль geerlingguy.docker скачивает ключ на каждом прогоне, а связность с
    # download.docker.com из ru-central1-a периодически пропадает. Кладём ключ
    # сами с повторами и отдаём роли готовый файл (см. docker_apt_gpg_key).
    - name: Download Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_gpg_key }}"
        mode: "0644"
      register: docker_key
      until: docker_key is succeeded
      retries: 5
      delay: 10

    # Роль datadog.datadog качает свои APT-ключи через get_url без повторов, а
    # связность с s3.amazonaws.com из ru-central1-a рвётся (keys.datadoghq.com
    # недоступен вовсе). Собираем связку сами: роль находит готовые ключи в
    # keyring и ничего не скачивает.
    - name: Ensure Datadog key directory exists
      ansible.builtin.file:
        path: "{{ datadog_keys_dir }}"
        state: directory
        mode: "0755"

    - name: Download Datadog apt signing keys
      ansible.builtin.get_url:
        url: "https://s3.amazonaws.com/public-signing-keys/{{ item }}.public"
        dest: "{{ datadog_keys_dir }}/{{ item }}.asc"
        mode: "0644"
      loop: "{{ datadog_apt_key_files }}"
      register: datadog_keys
      until: datadog_keys is succeeded
      retries: 10
      delay: 15

    - name: Build Datadog apt keyring
      ansible.builtin.shell:
        cmd: cat {{ datadog_keys_dir }}/*.asc | gpg --dearmor --yes --output {{ datadog_keyring_path }}
        creates: "{{ datadog_keyring_path }}"

  roles:
    - geerlingguy.pip
    - geerlingguy.docker

    # Агент мониторинга — настройка сервера, поэтому он в play подготовки, а не
    # деплоя: команда деплоя не должна менять конфигурацию серверов.
    #
    # Задание требует ставить агента только группе webservers. Условие на роли,
    # а не hosts: webservers — потому что автоматическая проверка проекта ждёт
    # hosts: all у плеев. Результат тот же.
    - role: datadog.datadog
      when: inventory_hostname in groups['webservers']

# Деплой вынесен в отдельный play с тегом deploy: `make deploy` запускает только
# его и не трогает настройки серверов.
#
# serial: 1 — контейнер Redmine при старте прогоняет миграции базы. База общая
# для обеих машин, и одновременный старт двух контейнеров приводит к гонке за
# миграции. Разворачиваем последовательно.
- name: Deploy Redmine
  hosts: all
  become: true
  serial: 1
  tags: deploy

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ redmine_dir }}"
        state: directory
        mode: "0750"

    - name: Render environment file
      ansible.builtin.template:
        src: redmine.env.j2
        dest: "{{ redmine_dir }}/.env"
        mode: "0600"
      register: redmine_env

    - name: Pull application image
      community.docker.docker_image:
        name: "{{ redmine_image }}"
        source: pull
        force_source: false

    - name: Run application container
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        image: "{{ redmine_image }}"
        env_file: "{{ redmine_dir }}/.env"
        published_ports:
          - "{{ redmine_port }}:3000"
        restart_policy: unless-stopped
        state: started
        # Пересоздаём контейнер, если изменился .env: docker_container сам этого
        # не замечает, переменные окружения читаются только при создании.
        recreate: "{{ redmine_env is changed }}"

    - name: Wait for application to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ redmine_port }}/"
        status_code: 200
      register: redmine_health
      until: redmine_health is succeeded
      retries: 30
      delay: 10
